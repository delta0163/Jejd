
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universe MIDI Creator</title>
<style>
body {
    background: #101018;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 25px;
}
button {
    background: #8b35dc;
    color: white;
    border: none;
    padding: 16px 25px;
    border-radius: 12px;
    font-size: 18px;
    margin-top: 20px;
}
button:active { background: #56218c; }
p { color: #bbb; }
</style>
</head>
<body>

<h1>UNIVERSE</h1>
<h2>First Meeting MIDI Creator</h2>

<p>Friday Night Funkin': Universe</p>
<p>Темп: 112 BPM</p>

<button onclick="createMidi()">Создать MIDI</button>

<p id="status">Ожидание...</p>

<script>
function vlq(n) {
    let bytes = [n & 127];
    while ((n >>= 7)) {
        bytes.unshift((n & 127) | 128);
    }
    return bytes;
}

function track(events, name) {
    let data = [0, 255, 3, name.length, ...new TextEncoder().encode(name)];
    let last = 0;

    events.sort((a,b) => a[0]-b[0] || a[1]-b[1]);

    for (const [time, priority, msg] of events) {
        data.push(...vlq(time-last), ...msg);
        last = time;
    }

    data.push(0,255,47,0);
    return [
        77,84,114,107,
        (data.length>>>24)&255,
        (data.length>>>16)&255,
        (data.length>>>8)&255,
        data.length&255,
        ...data
    ];
}

function createMidi() {
    const TPQ = 480;
    const BAR = 1920;
    const tracks = [];

    const tempo = Math.round(60000000 / 112);
    tracks.push(track([
        [0,0,[255,81,3,(tempo>>16)&255,(tempo>>8)&255,tempo&255]],
        [0,0,[255,88,4,4,2,24,8]]
    ], "Tempo"));

    const chords = [
        [55,59,62],
        [50,54,57],
        [52,55,59],
        [48,52,55]
    ];

    const melodies = [
        [74,76,79,76,74,71,74,76],
        [79,81,83,81,79,76,74,76],
        [71,74,79,74,71,69,71,74],
        [76,74,72,71,69,71,74,76]
    ];

    // Мелодия
    let lead = [[0,0,[192,80]]];

    for(let bar=0; bar<48; bar++) {
        const melody = melodies[bar%4];

        for(let i=0; i<8; i++) {
            const start = bar*BAR+i*240;
            const note = melody[i];

            lead.push([start,2,[144,note,95]]);
            lead.push([start+200,1,[128,note,0]]);
        }
    }

    tracks.push(track(lead,"Lead Melody"));

    // Пианино
    let piano = [[0,0,[193,4]]];

    for(let bar=0; bar<48; bar++) {
        for(let beat=0; beat<4; beat++) {
            const start = bar*BAR+beat*TPQ;

            for(const note of chords[bar%4]) {
                piano.push([start,2,[145,note,65]]);
                piano.push([start+400,1,[129,note,0]]);
            }
        }
    }

    tracks.push(track(piano,"Piano"));

    // Бас
    let bass = [[0,0,[194,33]]];

    for(let bar=0; bar<48; bar++) {
        const root = chords[bar%4][0]-12;

        for(let beat=0; beat<4; beat++) {
            const start = bar*BAR+beat*TPQ;
            const note = beat%2===0 ? root : root+7;

            bass.push([start,2,[146,note,80]]);
            bass.push([start+400,1,[130,note,0]]);
        }
    }

    tracks.push(track(bass,"Bass"));

    // Ударные
    let drums = [];

    for(let bar=0; bar<48; bar++) {
        for(let beat=0; beat<4; beat++) {
            const start = bar*BAR+beat*TPQ;
            const note = beat%2===0 ? 36 : 38;

            drums.push([start,2,[153,note,85]]);
            drums.push([start+100,1,[137,note,0]]);

            drums.push([start,2,[153,42,50]]);
            drums.push([start+60,1,[137,42,0]]);
        }
    }

    tracks.push(track(drums,"Drums"));

    const header = [
        77,84,104,100,
        0,0,0,6,
        0,1,
        0,tracks.length,
        1,224
    ];

    const midi = new Uint8Array([
        ...header,
        ...tracks.flat()
    ]);

    const blob = new Blob([midi], {
        type: "audio/midi"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "First_Meeting.mid";
    a.click();

    setTimeout(() => URL.revokeObjectURL(url), 3000);

    document.getElementById("status").textContent =
        "MIDI создан! Проверь загрузки.";
}
</script>

</body>
</html>
