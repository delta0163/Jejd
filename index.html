
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Memory - Downloads</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(145deg,#09090e,#21131d,#09090e);
  color: white;
  font-family: Arial, sans-serif;
  display: grid;
  place-items: center;
  padding: 20px;
}
.container {
  width: 100%;
  max-width: 430px;
  background: #15131b;
  border: 1px solid #49313f;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 15px 50px #0008;
}
h1 { margin-bottom: 5px; }
.subtitle { color: #aa9ba9; margin-bottom: 25px; }
.track {
  background: #211d27;
  border-radius: 13px;
  padding: 18px;
  margin-bottom: 15px;
}
.track h3 { margin: 0 0 8px; }
.track p { color: #a99daa; font-size: 13px; }
button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #a54c70;
  color: white;
  font-size: 15px;
  font-weight: bold;
}
button:active { transform: scale(.98); }
input {
  width: 100%;
  margin: 10px 0;
  color: white;
}
footer {
  text-align: center;
  color: #827783;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="container">
  <h1>LAST MEMORY</h1>
  <div class="subtitle">Piano compositions / Downloads</div>

  <div class="track">
    <h3>Последнее воспоминание</h3>
    <p>Melancholic Piano · D Minor · 85 BPM</p>
    <button onclick="downloadMidi()">Скачать MIDI</button>
  </div>

  <div class="track">
    <h3>Свой MIDI-файл</h3>
    <p>Можешь выбрать другой MIDI-файл на телефоне.</p>
    <input type="file" id="file" accept=".mid,.midi">
    <button onclick="downloadCustom()">Скачать выбранный файл</button>
  </div>

  <footer>LAST MEMORY © 2026</footer>
</div>

<script>
function downloadMidi() {
  const a = document.createElement("a");
  a.href = "poslednee_vospominanie_piano.mid";
  a.download = "poslednee_vospominanie_piano.mid";
  a.click();
}

function downloadCustom() {
  const file = document.getElementById("file").files[0];
  if (!file) {
    alert("Сначала выбери MIDI-файл!");
    return;
  }

  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url;
  a.download = file.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>
</body>
</html>
