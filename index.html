
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Meeting MIDI Studio</title>
<style>
body {
  background:#11121a;
  color:#eee;
  font-family:Arial,sans-serif;
  padding:20px;
  max-width:700px;
  margin:auto;
}
h1 {color:#b99aff}
.track {
  background:#202230;
  padding:15px;
  border-radius:12px;
  margin:12px 0;
}
button {
  background:#8057c9;
  color:white;
  border:0;
  border-radius:8px;
  padding:12px;
  margin:5px 3px;
  font-size:15px;
}
button:active {background:#54318f}
.small {color:#aaa;font-size:13px}
</style>
</head>
<body>

<h1>FIRST MEETING</h1>
<p>Friday Night Funkin': Universe</p>
<p class="small">112 BPM · G Major · 4/4</p>

<div id="tracks"></div>

<script>
const BPM = 112;
const TPQ = 480;
const BEAT = TPQ;
const BAR = BEAT * 4;

function vlq(value) {
  let buffer = value & 0x7f;
  const result = [];
  while ((value >>= 7)) {
    buffer <<= 8;
    buffer |= ((value & 0x7f) | 0x80);
  }
  while (true) {
    result.push(buffer & 255);
    if (buffer & 128) buffer >>= 8;
    else break;
  }
  return result;
}

function makeTrack(name, channel, program, notes) {
  let events = [];

  events.push({
    tick:0,
    priority:0,
    data:[0xff,0x03,name.length,...Array.from(name,c=>c.charCodeAt(0))]
  });

  events.push({
    tick:0,
    priority:1,
    data:[0xff,0x51,0x03,0x07,0xa1,0x20]
  });

  if (channel !== 9) {
    events.push({
      tick:0,
      priority:2,
      data:[0xc0 | channel,program]
    });
  }

  notes.forEach(n => {
    events.push({
      tick:n.start,
      priority:3,
      data:[0x90 | channel,n.pitch,n.velocity || 90]
    });
    events.push({
      tick:n.start+n.length,
      priority:2,
      data:[0x80 | channel,n.pitch,0]
    });
  });

  events.sort((a,b) =>
    a.tick-b.tick || a.priority-b.priority
  );

  let bytes = [];
  let lastTick = 0;

  events.forEach(e => {
    bytes.push(...vlq(e.tick-lastTick),...e.data);
    lastTick = e.tick;
  });

  bytes.push(0,0xff,0x2f,0);

  return [
    77,84,114,107,
    (bytes.length>>>24)&255,
    (bytes.length>>>16)&255,
    (bytes.length>>>8)&255,
    bytes.length&255,
    ...bytes
  ];
}

function makeMidi(name, channel, program, notes) {
  const track = makeTrack(name,channel,program,notes);
  const header = [
    77,84,104,100,
    0,0,0,6,
    0,0,0,1,
    1,224
  ];
  return new Uint8Array([...header,...track]);
}

function note(pitch,start,length,velocity=90) {
  return {pitch,start,length,velocity};
}

const P = [
  67,71,74,71,69,71,74,79,
  74,71,69,67,69,71,74,71
];

function buildPiano() {
  let a=[];
  for(let bar=0;bar<12;bar++){
    P.forEach((p,i)=>{
      a.push(note(p,bar*BAR+i*120,100,75));
    });
  }
  return a;
}

function buildBass() {
  let a=[];
  const roots=[43,40,45,38];
  for(let bar=0;bar<12;bar++){
    let root=roots[bar%4];
    a.push(note(root,bar*BAR,300,100));
    a.push(note(root+7,bar*BAR+480,220,85));
    a.push(note(root+12,bar*BAR+960,220,85));
    a.push(note(root+7,bar*BAR+1440,220,85));
  }
  return a;
}

function buildDrums() {
  let a=[];
  for(let bar=0;bar<12;bar++){
    for(let beat=0;beat<4;beat++){
      let t=bar*BAR+beat*BEAT;
      a.push(note(beat%2===0?36:38,t,100,100));
      a.push(note(42,t+240,80,65));
    }
  }
  return a;
}

function buildSynth() {
  let a=[];
  for(let bar=0;bar<12;bar++){
    [55,59,62,59].forEach((p,i)=>{
      a.push(note(p,bar*BAR+i*480,400,60));
    });
  }
  return a;
}

function buildGlock() {
  let a=[];
  for(let bar=0;bar<12;bar++){
    [79,83,86,83].forEach((p,i)=>{
      a.push(note(p,bar*BAR+i*480,180,75));
    });
  }
  return a;
}

// Отдельная вокальная партия Дельты
function buildDeltaVoice() {
  let a=[];
  const melody = [
    [55,0,300],
    [57,480,240],
    [59,720,240],
    [62,960,420],
    [59,1440,240],
    [57,1680,240],
    [55,1920,600],
    [62,2880,300],
    [64,3360,240],
    [62,3600,240],
    [59,3840,420],
    [57,4320,300],
    [55,4800,600],
    [59,5760,300],
    [62,6240,240],
    [64,6480,240],
    [67,6720,600],
    [64,7680,300],
    [62,8160,240],
    [59,8400,240],
    [55,8640,900]
  ];

  melody.forEach(([pitch,start,length]) => {
    a.push(note(pitch,start,length,105));
  });

  return a;
}

const data = [
  ["01_Piano.mid","Piano",0,0,buildPiano()],
  ["02_Bass.mid","Bass",1,33,buildBass()],
  ["03_Drums.mid","Drums",9,0,buildDrums()],
  ["04_Synth.mid","Synth",2,89,buildSynth()],
  ["05_Glockenspiel.mid","Glockenspiel",3,9,buildGlock()],
  ["06_Delta_Voice.mid","Delta Voice",4,33,buildDeltaVoice()]
];

function downloadMidi(item) {
  const [filename,name,channel,program,notes] = item;
  const midi=makeMidi(name,channel,program,notes);
  const blob=new Blob([midi],{type:"audio/midi"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=filename;
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

const container=document.getElementById("tracks");

data.forEach((item,index)=>{
  const div=document.createElement("div");
  div.className="track";
  div.innerHTML=`
    <h3>${item[1]}</h3>
    <p class="small">${item[0]}</p>
    <button>Скачать MIDI</button>
  `;
  div.querySelector("button").onclick=()=>downloadMidi(item);
  container.appendChild(div);
});
</script>
</body>
</html>
