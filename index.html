
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXPERIMENT MIDI Studio</title>
<style>
body{background:#10111a;color:#eee;font-family:Arial;padding:18px;max-width:720px;margin:auto}
h1{color:#bd9aff}
.card{background:#202230;border:1px solid #39394b;border-radius:12px;padding:15px;margin:12px 0}
.delta{border-left:4px solid #ad78ff}
.hack{border-left:4px solid #50bce8}
button{background:#8057c9;color:white;border:0;border-radius:8px;padding:12px;margin:5px 3px;font-size:15px}
small,.muted{color:#aaa}
</style>
</head>
<body>
<h1>EXPERIMENT</h1>
<p>Friday Night Funkin': Universe</p>
<p class="muted">128 BPM | D Minor | 4/4 | 48 тактов</p>

<h2>Инструменты</h2>
<div id="instruments"></div>
<h2>Вокальные партии</h2>
<div id="voices"></div>

<script>
const BPM=128, TPQ=480, BAR=1920, TOTAL=48;

function vlq(v){
 let b=v&127,r=[];
 while(v>>=7){b<<=8;b|=(v&127)|128}
 while(true){r.push(b&255);if(b&128)b>>=8;else break}
 return r;
}

function makeMidi(name,ch,program,notes){
 const events=[];
 const nb=[...new TextEncoder().encode(name)];
 events.push({t:0,p:0,d:[255,3,...vlq(nb.length),...nb]});

 const tempo=Math.round(60000000/BPM);
 events.push({t:0,p:1,d:[255,81,3,(tempo>>16)&255,(tempo>>8)&255,tempo&255]});
 events.push({t:0,p:2,d:[255,88,4,4,2,24,8]});

 if(program!==null)
  events.push({t:0,p:3,d:[192|ch,program]});

 notes.forEach(n=>{
  events.push({t:n.s,p:5,d:[144|ch,n.p,n.v]});
  events.push({t:n.s+n.l,p:4,d:[128|ch,n.p,0]});
 });

 events.sort((a,b)=>a.t-b.t||a.p-b.p);
 let bytes=[],last=0;

 for(const e of events){
  bytes.push(...vlq(e.t-last),...e.d);
  last=e.t;
 }
 bytes.push(0,255,47,0);

 const track=[77,84,114,107,
  (bytes.length>>>24)&255,(bytes.length>>>16)&255,
  (bytes.length>>>8)&255,bytes.length&255,...bytes];

 const header=[77,84,104,100,0,0,0,6,0,0,0,1,1,224];
 return new Uint8Array([...header,...track]);
}

function N(p,s,l,v=90){return {p,s,l,v}}

// PIANO: напряжённые короткие мотивы
function piano(){
 let a=[];
 const patterns=[
  [62,65,69,72,69,65,62,60],
  [62,67,70,74,70,67,65,62],
  [57,60,65,69,65,60,57,60],
  [58,62,65,70,65,62,60,58]
 ];
 for(let b=0;b<TOTAL;b++){
  patterns[Math.floor(b/4)%4].forEach((p,i)=>{
   a.push(N(p,b*BAR+i*240,190,75));
  });
 }
 return a;
}

// BASS
function bass(){
 let a=[];
 const roots=[38,41,34,36];
 for(let b=0;b<TOTAL;b++){
  let r=roots[b%4],t=b*BAR;
  a.push(N(r,t,700,110));
  a.push(N(r+7,t+960,350,90));
  a.push(N(r+12,t+1440,350,95));
 }
 return a;
}

// DRUMS
function drums(){
 let a=[];
 for(let b=0;b<TOTAL;b++){
  for(let beat=0;beat<4;beat++){
   let t=b*BAR+beat*480;
   a.push(N(beat%2===0?36:38,t,100,105));
   a.push(N(42,t+240,90,70));
  }
  if(b%4===3){
   a.push(N(45,b*BAR+1680,120,85));
  }
 }
 return a;
}

// SYNTH: холодный лабораторный звук
function synth(){
 let a=[];
 const chords=[
  [50,57,62,65],
  [53,60,65,69],
  [46,53,58,62],
  [48,55,60,63]
 ];
 for(let b=0;b<TOTAL;b++){
  chords[Math.floor(b/4)%4].forEach(p=>{
   a.push(N(p,b*BAR,BAR*2,55));
  });
 }
 return a;
}

// GLOCKENSPIEL: редкие высокие ноты
function glock(){
 let a=[];
 const seq=[86,89,93,89,84,88,91,88];
 for(let b=0;b<TOTAL;b+=2){
  seq.forEach((p,i)=>{
   a.push(N(p,b*BAR+i*240,180,65));
  });
 }
 return a;
}

// DELTA: низкий басовый вокал
function delta(){
 let a=[];
 const phrases=[
  [50,53,57,60],
  [57,55,53,50],
  [50,57,60,62],
  [60,57,55,53],
  [46,50,53,57],
  [57,53,50,48],
  [50,53,57,60],
  [57,55,53,50]
 ];

 for(let section=0;section<12;section++){
  const ph=phrases[section%phrases.length];
  const base=section*4;

  // Первый и третий такты: Дельта
  for(const [offset,index] of [[0,0],[2,2]]){
   const start=(base+offset)*BAR;
   a.push(N(ph[index],start,BAR*1.5,118));
   a.push(N(ph[index+1],start+BAR*1.5,BAR*0.45,105));
  }
 }
 a.push(N(50,46*BAR,2*BAR,120));
 return a;
}

// HACK: более высокий ответный вокал
function hack(){
 let a=[];
 const phrases=[
  [62,65,69,72],
  [69,67,65,62],
  [62,69,72,74],
  [72,69,67,65],
  [58,62,65,69],
  [69,65,62,60],
  [62,65,69,72],
  [69,67,65,62]
 ];

 for(let section=0;section<12;section++){
  const ph=phrases[section%phrases.length];
  const base=section*4;

  // Хак отвечает во втором и четвёртом тактах
  for(const [offset,index] of [[1,0],[3,2]]){
   const start=(base+offset)*BAR;
   a.push(N(ph[index],start,BAR*1.65,115));
   a.push(N(ph[index+1],start+BAR*1.65,BAR*0.3,100));
  }
 }
 a.push(N(62,47*BAR,BAR,120));
 return a;
}

const instruments=[
 ["01_Piano.mid","Piano",0,0,piano(),"Acoustic Grand Piano"],
 ["02_Bass.mid","Bass",1,33,bass(),"Fingered Bass"],
 ["03_Drums.mid","Drums",9,null,drums(),"Standard Kit"],
 ["04_Synth.mid","Synth",2,89,synth(),"Warm Pad"],
 ["05_Glockenspiel.mid","Glockenspiel",3,9,glock(),"Glockenspiel"]
];

const voices=[
 ["06_Delta_Voice.mid","Delta Voice",4,38,delta(),"Synth Bass 2"],
 ["07_Hack_Voice.mid","Hack Voice",5,52,hack(),"Choir Aahs"]
];

function download(item){
 const bytes=makeMidi(item[1],item[2],item[3],item[4]);
 const blob=new Blob([bytes],{type:"audio/midi"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=item[0];
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function addCard(item,parent,cls=""){
 const d=document.createElement("div");
 d.className="card "+cls;
 const h=document.createElement("h3");
 h.textContent=item[1];
 const p=document.createElement("p");
 p.textContent="Инструмент: "+item[5];
 p.className="muted";
 const f=document.createElement("small");
 f.textContent=item[0];
 const btn=document.createElement("button");
 btn.textContent="Скачать MIDI";
 btn.onclick=()=>download(item);
 d.append(h,p,f,document.createElement("br"),btn);
 parent.appendChild(d);
}

instruments.forEach(x=>addCard(x,document.getElementById("instruments")));
addCard(voices[0],document.getElementById("voices"),"delta");
addCard(voices[1],document.getElementById("voices"),"hack");
</script>
</body>
</html>
